<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Ray Companion</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0B162A"/>
<link rel="icon" href="icons/icon-192.png"/>
<style>html,body{height:100%;margin:0;background:#0B162A;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif}</style>
</head>
<body>
<main style="height:100vh;display:flex;flex-direction:column">
<header style="padding:12px 16px;background:linear-gradient(90deg,#0B162A,#8C1C13);font-weight:600">Ray Companion • v0.1</header>
<iframe id="appframe" src="about:blank" title="Ray App" style="flex:1;border:0;background:#111"></iframe>
</main>
<script>
(async()=>{
  const r = await fetch('version.json').catch(()=>null);
  const j = r ? await r.json() : {};
  document.getElementById('appframe').src = j.streamlit_url || 'about:blank';
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
})();
</script>
</body>
</html>
